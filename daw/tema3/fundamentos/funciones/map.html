  <body>
    <script>
      /*
        Ejemplo 1 · Calcular el precio con IVA
        */
      const precios = [10, 25, 40]
      const preciosConIva = precios.map((precio) => precio * 1.21)

      console.log(preciosConIva) // [12.1, 30.25, 48.4]
      console.log(precios) // [10, 25, 40] → el original no cambia
    </script>
  </body>
</html>
