<form action="/registrar" method="POST" novalidate>
  <fieldset>
    <legend>Datos personales</legend>

    <!-- label for + input id: vinculan el texto con el control -->
    <label for="nombre">Nombre completo *</label>
    <input
      type="text"
      id="nombre"
      name="nombre"
      placeholder="Ej: Ana García"
      required
      minlength="3"
      maxlength="100"
      autocomplete="name"
    />

    <label for="email">Correo electrónico *</label>
    <input type="email" id="email" name="email" required />

    <label for="nivel">Nivel de experiencia</label>
    <select id="nivel" name="nivel">
      <option value="">-- Selecciona --</option>
      <option value="junior">Junior</option>
      <option value="mid">Mid</option>
      <option value="senior">Senior</option>
    </select>

    <label for="bio">Presentación</label>
    <textarea id="bio" name="bio" rows="4" maxlength="500"></textarea>

    <!-- Grupo de checkboxes relacionados -->
    <fieldset>
      <legend>Tecnologías que conoces</legend>
      <label><input type="checkbox" name="tec" value="html"> HTML</label>
      <label><input type="checkbox" name="tec" value="css"> CSS</label>
      <label><input type="checkbox" name="tec" value="js"> JavaScript</label>
    </fieldset>
  </fieldset>

  <button type="submit">Registrarse</button>
  <button type="reset">Limpiar</button>
</form>
